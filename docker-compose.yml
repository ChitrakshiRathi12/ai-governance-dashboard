version: "3.9"

services:

  # ── FastAPI REST API ──────────────────────────────────────────────────────
  api:
    build: .
    container_name: governance-api
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports   # persist generated reports
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit Dashboard ───────────────────────────────────────────────────
  dashboard:
    build: .
    container_name: governance-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped
    depends_on:
      - api
